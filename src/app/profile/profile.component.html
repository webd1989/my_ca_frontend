<main>
    <div class="main-wrapper">
        <!-- Page Content :: Start  -->
        <div id="content">
            <!-- Top Bar :: Start -->
            <app-header></app-header>
            <!-- Top Bar :: End -->

<div class="mainTabss">
    <app-tabs></app-tabs>
     <div class="main-area position-relative">
                
                <div class="page-card-body p-20">
                    <div class="row">
                        <div class="col-lg-3">
                            <app-sidebar></app-sidebar>
                        </div>
                        <div class="col-lg-9 col-xl-8">
                            <div class="mb-20">
                                <div class="card settings-card">
                                <div class="breadcrumb-info mb-3">
                                    <h2 class="d-flex align-items-center mb-1">User Profile</h2>
                                    <p class="mb-0">Update your photo and personal details.</p>
                                </div>
                                <div class="avatar-uploader">
                                    <span class="erp-avatar">
                                        <img *ngIf="userData?.photo" id="profile_pic" src="{{profilePic}}" alt="Profile picture">
                                        <ng-container *ngIf="!userData?.photo">{{(userData?.name || 'U').charAt(0)}}</ng-container>
                                    </span>
                                    <div class="flex-grow-1">
                                        <b>Profile Picture</b>
                                        <p>JPG or PNG, square image works best.</p>
                                    </div>
                                    <button type="button" id="uploadBtn" class="btn btn-primary btn-sm" #upload (click)="file.click()">Upload</button>
                                    <input #file type="file" id="document" accept="image/*" style="display:none" (change)="uploadDoc()">
                                </div>
                                <div class="form-grid">
                                    <div class="form-group">
                                        <label class="text-uppercase">Name</label>
                                        <input type="text" name="name" id="name" class="form-control" placeholder="Full name">
                                    </div>
                                    <div class="form-group">
                                        <label class="text-uppercase">Email</label>
                                        <input readonly type="text" name="email" id="email" class="form-control" placeholder="">
                                    </div>
                                    <div class="form-group">
                                        <label class="text-uppercase">Phone</label>
                                        <input type="text" maxlength="10" name="phome" id="phone" class="form-control" placeholder="10-digit mobile">
                                    </div>
                                    <div class="form-group">
                                        <label class="text-uppercase">Address</label>
                                        <input type="text" name="address" id="address" class="form-control" placeholder="Street address">
                                    </div>
                                    <div class="form-group">
                                        <label class="text-uppercase">City</label>
                                        <input type="text" name="city" id="city" class="form-control" placeholder="">
                                    </div>
                                    <div class="form-group">
                                        <label class="text-uppercase">State</label>
                                        <input type="text" name="state" id="state" class="form-control" placeholder="">
                                    </div>
                                    <div class="form-group">
                                        <label class="text-uppercase">Country</label>
                                        <input type="text" name="country" id="country" class="form-control" placeholder="">
                                    </div>
                                    <div class="form-group">
                                        <label class="text-uppercase">Zip / Postal</label>
                                        <input type="text" name="zipcode" id="zipcode" class="form-control" placeholder="">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="text-uppercase">Email Digest</label>
                                    <div class="d-flex gap-4">
                                        <label class="d-inline-flex align-items-center gap-2"><input name="dailyDigest" type="checkbox" value="false"> Daily</label>
                                        <label class="d-inline-flex align-items-center gap-2"><input name="weeklyDigest" type="checkbox" value="false"> Weekly</label>
                                    </div>
                                </div>
                                <div class="d-flex justify-content-end border-top pt-3 mt-2">
                                    <button type="button" (click)="UpdateProfile()" id="profileUpdateBtn" class="btn btn-primary">Save Changes</button>
                                </div>
                            </div>
                            </div>
                        </div>
                        
                    </div>
                    
                </div>
            </div>
</div>
            <!-- main Area :: Start -->
           
            <!--Footer :: Start-->
        </div>
        <!-- Page Content :: End -->
        <app-footer></app-footer>
        <!--Footer :: End-->
    </div>
</main>
