<main class="auth-page">
	<section class="auth-hero">
		<span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
		<div><span class="logo-chip"><img src="assets/images/web-d-logo.jpg" alt="WebD IT Solutions"></span></div>
		<div>
			<h1>Locked out? <span>We've got you.</span></h1>
			<p class="lead-txt">Enter your user ID and we'll help you get back into your ERP workspace.</p>
		</div>
		<div class="hero-foot">WebD IT Solutions</div>
	</section>
	<section class="auth-panel">
		<div class="auth-card">
			<div class="mobile-logo"><img src="assets/images/web-d-logo.jpg" alt="WebD IT Solutions"></div>
			<h2>Forgot password</h2>
			<p class="sub">Enter your user ID to retrieve your password.</p>
			<form method="post" (submit)="$event.preventDefault()">
				<div class="auth-field">
					<label for="username">User ID</label>
					<i class="far fa-user ic"></i>
					<input type="text" class="form-control" name="userid" id="username" placeholder="Enter your user ID"/>
				</div>
				<div class="auth-row">
					<span></span>
					<a routerLink="/">Back to login</a>
				</div>
				<button type="submit" id="loginBtn" class="btn btn-primary auth-btn">Submit</button>
			</form>
		</div>
	</section>
</main>
