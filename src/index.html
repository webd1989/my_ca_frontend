<!doctype html>

  <meta name="theme-color" content="#0b1226">
  <link rel="manifest" href="assets/manifest.json">
  <script>
    /* apply saved light/dark theme before first paint (no flash) */
    (function(){try{var t=localStorage.getItem('erp-theme');if(!t){t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-bs-theme',t);}catch(e){document.documentElement.setAttribute('data-bs-theme','light');}})();
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
  <link rel="stylesheet" href="assets/fonts/css/all.min.css" />

  <link rel="stylesheet" href="assets/css/select2.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/theme.css" />
</head>

  <!-- Footer Script :: Start -->
